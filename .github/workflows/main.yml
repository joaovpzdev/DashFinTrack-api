name: Deploy

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v2
        - name: Use Node.
          uses: actions/setup-node@v2
          with:
            node-version: '24'
        - name: Create .env.test file
          run: echo "DATABASE_URL=\postgresql://root:samirabradinho@localhost:5433/dashfintrackapp_test?schema=public\" > .env.test
        - name: Install dependencies
          run: npm install
        - name: ESlint
          run: npm run eslint:check
        - name: Prettier
          run: npm run prettier:check
        - name: Test
          run: npm run test
        